name: Android debug build

on:
  push:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the deprecated `tools` SDK package.
          # Override its package list; this action installs cmdline-tools itself.
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 gradle-build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
